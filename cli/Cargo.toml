[package]
name = "circle-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "circle-cli"
path = "src/main.rs"

[dependencies]
solana-savings-circle = { path = "../programs/solana-savings-circle", features = ["no-entrypoint"] }
anchor-client = "0.32.1"
anchor-spl = { version = "0.32.1", features = ["token", "associated_token"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
